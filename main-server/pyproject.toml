[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord-py==2.3.2",
    "fastapi==0.104.1",
    "psycopg2-binary==2.9.9",
    "pydantic==2.5.2",
    "sqlalchemy==2.0.23",
    "uvicorn==0.24.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["app"]
